name: ai-task-platform

services:
  backend:
    build: ./backend
    image: shubhamkah/ai-task-backend:latest
    container_name: backend
    ports:
    - "5000:5000"
    env_file:
     - ./backend/.env
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
    
  frontend:
    build: ./frontend
    image: shubhamkah/ai-task-frontend:latest
    container_name: frontend
    ports:
     - "5173:80"
    depends_on:
    - backend 
    restart: unless-stopped

  worker:
    build: ./worker
    image: shubhamkah/ai-task-worker:latest
    container_name: worker
    env_file:
      - ./worker/.env
    depends_on:
      - redis
      - mongo
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: redis
    ports:
    - "6379:6379"
    restart: unless-stopped
  
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped


volumes:
  mongo_data:
      






